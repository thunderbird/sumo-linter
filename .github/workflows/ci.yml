name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # Includes the corpus property tests: round-trip must hold byte-for-byte
        # on every committed article, and safe fixes must be idempotent.
        run: cargo test --all
      - name: Build WASM
        # The core crate is I/O-free precisely so this works; if it ever pulls in
        # something native, this job is what catches it.
        run: cargo build -p sumo-lint-wasm --release --target wasm32-unknown-unknown

      - name: Lint the corpus
        # The committed corpus has 5 known errors, all filed as issues
        # (#223, #224, #225, #228). Exit code 1 is therefore expected; this step
        # exists to surface the report, not to gate.
        run: cargo run --release -p sumo-lint-cli -- corpus/en-US || true

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        run: npm ci
        working-directory: editors/vscode
      - name: Grammar tests
        # Tokenises a fixture with vscode-textmate, the same engine VS Code uses,
        # and asserts the scope at given columns. A grammar that silently stops
        # matching looks fine until someone opens a file.
        run: npm test
        working-directory: editors/vscode

  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        # emacs-nox is enough — the tests are batch mode and never open a frame.
        # Noble ships 29.x, which matters: eglot is only built in from 29.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
          emacs --version | head -1
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        # The mode shells out to the real `sumo-lint` for fix, style and Flymake,
        # so this test needs a binary, not a mock. That is the point of it: an
        # argument or JSON-shape change in the CLI breaks the mode, and nothing
        # else would notice.
        run: cargo build --release -p sumo-lint-cli
      - name: Mode tests
        run: |
          PATH="$PWD/target/release:$PATH" \
            emacs -Q --batch -l editors/emacs/test-sumo-wiki-mode.el

  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax-check the dev-only scraper
        run: |
          node --check tools/scrape/scrape.mjs
          node --check tools/scrape/report.mjs
